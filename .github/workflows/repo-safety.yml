name: Repository safety

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python3 -m compileall -q scripts

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      - name: Validate manifest and upstream tags
        run: python3 scripts/validate_manifest.py --verify-upstream

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
