name: Repository safety

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install coverage==7.15.4 PyYAML==6.0.3

      - name: Compile Python sources
        run: python3 -m compileall -q scripts

      - name: Check managed JSON formatting
        run: python3 scripts/format_json.py --check

      - name: Check README and backlog consistency
        run: python3 scripts/check_repo_consistency.py

      - name: Run unit tests
        run: |
          coverage run -m unittest discover -s scripts -p "test_*.py" -v
          {
            echo '```'
            coverage report -m
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate manifest and upstream tags
        run: python3 scripts/validate_manifest.py --verify-upstream

  workflow-lint:
    name: Workflow validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: python -m pip install PyYAML==6.0.3

      - run: python scripts/check_workflows.py

      - run: python -m unittest discover -s scripts -p "test_check_workflows.py" -v

      - name: Validate GitHub Actions workflows
        run: |
          mapfile -t workflows < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          curl -fsSL -o actionlint_1.7.12_linux_amd64.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o actionlint_checksums.txt \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep 'actionlint_1.7.12_linux_amd64.tar.gz' actionlint_checksums.txt \
            | sha256sum --check --strict
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint
          ./actionlint "${workflows[@]}"
          rm -f actionlint actionlint_1.7.12_linux_amd64.tar.gz actionlint_checksums.txt
