name: Daily Upstream Plugin Check

on:
  schedule:
    # Run daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated plugin names to check/bump'
        required: false
        type: string
      dry_run:
        description: 'Audit and preview bumps without mutating git or triggering builds'
        required: false
        default: false
        type: boolean

concurrency:
  group: plugins-daily-upstream-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-plugins:
    name: Audit and Auto-Bump Upstream Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.WATCH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run upstream check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_ONLY}" && ! "${INPUT_ONLY}" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            echo "error: invalid --only filter '${INPUT_ONLY}'" >&2
            exit 1
          fi
          ARGS=(--report "${RUNNER_TEMP}/upstream-audit-report.md")
          if [ -n "${INPUT_ONLY}" ]; then
            ARGS+=(--only "${INPUT_ONLY}")
          fi
          python scripts/check_upstream_updates.py "${ARGS[@]}"

      - name: Bump manifest for eligible tagged plugins
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_ONLY}" && ! "${INPUT_ONLY}" =~ ^[A-Za-z0-9_,-]+$ ]]; then
            echo "error: invalid --only filter '${INPUT_ONLY}'" >&2
            exit 1
          fi
          ARGS=(--json-out "${RUNNER_TEMP}/bump-summary.json")
          if [ -n "${INPUT_ONLY}" ]; then
            ARGS+=(--only "${INPUT_ONLY}")
          fi
          if [ "${DRY_RUN}" != "true" ]; then
            ARGS+=(--write)
          fi
          python scripts/bump_manifest_from_upstream.py "${ARGS[@]}"

      - name: Open PR, merge, and dispatch build for bumped plugins
        id: pr
        if: steps.bump.outputs.bumped_plugins != '' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.WATCH_PAT }}
          BUMPED_PLUGINS: ${{ steps.bump.outputs.bumped_plugins }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "error: WATCH_PAT secret is required to open and auto-merge bump PRs" >&2
            exit 1
          fi
          python scripts/validate_manifest.py --verify-upstream --only "$BUMPED_PLUGINS"
          PREFIX="chore/auto-bump-plugins-"
          if [ "$(gh pr list --state open --limit 100 --json headRefName \
              --jq "[.[].headRefName | select(startswith(\"${PREFIX}\"))] | length")" != "0" ]; then
            echo "An open auto-bump PR already exists; skipping."
            exit 0
          fi
          BRANCH="${PREFIX}$(date -u +%Y%m%d)-${RUN_ID}-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          python scripts/sync_docs.py --write
          python scripts/format_json.py --check
          python scripts/check_repo_consistency.py
          git add manifest.json README.md docs/roadmap.md
          git commit -m "chore(manifest): auto-bump upstream plugins (${BUMPED_PLUGINS})"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore(manifest): auto-bump upstream plugins (${BUMPED_PLUGINS})" \
            --body "Automated minor/patch upstream tag bump for: \`${BUMPED_PLUGINS}\`." \
            --head "$BRANCH" --base main)
          echo "Created $PR_URL"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          fail_bump_pr() {
            echo "$1" >&2
            gh pr view "$PR_URL" --json state,mergeable,reviewDecision,statusCheckRollup >&2 || true
            exit 1
          }

          # Poll until all required checks are reported on the PR before watching.
          # Do not arm --auto before checks pass, so a failed or timed-out run can
          # never leave a PR that merges later without dispatching build.yml.
          echo "Waiting for required checks to report on $PR_URL..."
          REQUIRED_CHECKS_READY=false
          ATTEMPTS=0
          while [ "$ATTEMPTS" -lt 18 ]; do
            CHECK_RC=0
            CHECK_COUNT=$(gh pr checks "$PR_URL" --required --json name --jq 'length' 2>/dev/null) || CHECK_RC=$?
            if { [ "$CHECK_RC" -eq 0 ] || [ "$CHECK_RC" -eq 8 ]; } && [[ "${CHECK_COUNT:-}" =~ ^[0-9]+$ ]] && [ "$CHECK_COUNT" -ge 2 ]; then
              echo "Detected $CHECK_COUNT required checks reported."
              REQUIRED_CHECKS_READY=true
              break
            fi
            sleep 5
            ATTEMPTS=$((ATTEMPTS + 1))
          done
          if [ "$REQUIRED_CHECKS_READY" != "true" ]; then
            fail_bump_pr "error: timed out waiting for required checks to appear on $PR_URL (last count=${CHECK_COUNT:-none}, rc=${CHECK_RC:-unknown})"
          fi

          if ! gh pr checks "$PR_URL" --watch --required --interval 15; then
            fail_bump_pr "error: required checks failed for $PR_URL"
          fi

          MERGED=false
          MERGE_ATTEMPT=0
          while [ "$MERGE_ATTEMPT" -lt 3 ]; do
            if gh pr merge "$PR_URL" --squash --delete-branch; then
              MERGED=true
              break
            fi
            STATE=$(gh pr view "$PR_URL" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "MERGED" ]; then
              MERGED=true
              break
            fi
            sleep 5
            MERGE_ATTEMPT=$((MERGE_ATTEMPT + 1))
          done
          if [ "$MERGED" != "true" ]; then
            fail_bump_pr "error: gh pr merge failed for $PR_URL"
          fi
          STATE=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$STATE" != "MERGED" ]; then
            fail_bump_pr "error: auto-bump PR is ${STATE}, expected MERGED"
          fi
          echo "Merged $PR_URL; dispatching build.yml for ${BUMPED_PLUGINS}"
          gh workflow run build.yml --ref main -f only="$BUMPED_PLUGINS"

      - name: Close unmerged auto-bump PR on failure or cancellation
        if: ${{ always() && steps.pr.outputs.pr_url != '' }}
        env:
          GH_TOKEN: ${{ secrets.WATCH_PAT }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          STATE=$(gh pr view "$PR_URL" --json state --jq .state 2>/dev/null || echo UNKNOWN)
          if [ "$STATE" != "OPEN" ]; then
            exit 0
          fi
          CLOSED=false
          CLOSE_ATTEMPT=0
          while [ "$CLOSE_ATTEMPT" -lt 3 ]; do
            gh pr close "$PR_URL" --delete-branch >/dev/null 2>&1 || true
            STATE=$(gh pr view "$PR_URL" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "CLOSED" ] || [ "$STATE" = "MERGED" ]; then
              CLOSED=true
              break
            fi
            sleep 5
            CLOSE_ATTEMPT=$((CLOSE_ATTEMPT + 1))
          done
          if [ "$CLOSED" != "true" ]; then
            echo "error: failed to close $PR_URL (state=${STATE}); manual cleanup is required" >&2
            exit 1
          fi
