name: Trigger Kiro Crew

on:
  push:
    branches: [main]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  trigger:
    if: >
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/kirocrew') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    uses: tonythethompson/.github/.github/workflows/kiro-crew-trigger.yml@b2fd2ee8a40eb69c0e5dfd832a3d4f2ed07c4d62 # main
    with:
      daytona_os: linux
      one_off_instruction: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
    secrets:
      KIRO_WEBHOOK_TOKEN: ${{ secrets.KIRO_WEBHOOK_TOKEN }}
      KIRO_WEBHOOK_SECRET: ${{ secrets.KIRO_WEBHOOK_SECRET }}
      KIRO_GATEWAY_URL: ${{ secrets.KIRO_GATEWAY_URL }}
      KIRO_GATEWAY_ORIGIN: ${{ secrets.KIRO_GATEWAY_ORIGIN }}
