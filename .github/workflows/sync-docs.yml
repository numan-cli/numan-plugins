name: Sync docs from manifest

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}  # No top-level write permissions; grant write only at the job level

concurrency:
  group: sync-docs-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync docs from manifest
    runs-on: ubuntu-latest
    # Skip forks (no write token) and dependabot.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Sync docs
        run: python3 scripts/sync_docs.py --write

      - name: Commit changes
        run: |
          if git diff --quiet HEAD --; then
            echo "No doc changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/roadmap.md
          git commit -m "chore(docs): sync from manifest [skip ci]"
          git push