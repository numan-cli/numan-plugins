# Pre-commit hooks for numan-plugins.
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: format-json
        name: Format managed JSON (manifest + backlog)
        entry: python3 scripts/format_json.py --check
        language: system
        pass_filenames: false
        files: '^(manifest\.json|docs/backlog\.json)$'

      - id: repo-consistency
        name: README/backlog consistency checks
        entry: python3 scripts/check_repo_consistency.py
        language: system
        pass_filenames: false
        files: '^(manifest\.json|docs/backlog\.json|README\.md)$'

      - id: compileall-scripts
        name: Compile Python scripts
        entry: python3 -m compileall -q scripts
        language: system
        pass_filenames: false
        types: [python]
        files: '^scripts/'
